        let allLevels = [];

        const sourceBadge = document.getElementById('sourceBadge');

        async function fetchLevels() {
            content.innerHTML = '<div class="loading">Loading levels...</div>';
            try {
                const response = await fetch(`${API_BASE}/levels`);
                const data = await response.json();
                allLevels = data.data;
                sourceBadge.textContent = `🟢 LIVE API — ${allLevels.length} levels loaded`;
                sourceBadge.className = 'badge live';
            } catch (error) {
                allLevels = EMBEDDED_LEVELS;
                sourceBadge.textContent = `🟡 OFFLINE SNAPSHOT — ${allLevels.length} levels (API blocks browser requests, snapshot from Sep 26 2026)`;
                sourceBadge.className = 'badge offline';
            }
            sourceBadge.style.display = 'inline-block';
            totalLevelsEl.textContent = allLevels.length;
            document.getElementById('levelNames').innerHTML = allLevels.map(l => `<option value="${l.name}">`).join('');
            content.innerHTML = '<div class="loading">Select category and click Start Challenge!</div>';
        }

        function getYoutubeId(url) {
            if (!url) return null;
            const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
            return m ? m[1] : null;
        }

        function getThumbnail(level) {
            if (level.thumbnailUrl) {
                return level.thumbnailUrl.startsWith('http')
                    ? level.thumbnailUrl
                    : `${SITE_BASE}${level.thumbnailUrl}`;
            }
            const ytId = getYoutubeId(level.youtubeUrl);
            return ytId
                ? `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`
                : 'https://via.placeholder.com/800x450?text=No+Thumbnail';
        }

        function filterLevels() {
            const category = categorySelect.value;
            if (category === 'all') {
                return [...allLevels];
            }
            return allLevels.filter(level => level.category === category);
        }

        function getRandomLevel() {
            const index = Math.floor(Math.random() * remainingLevels.length);
            return remainingLevels.splice(index, 1)[0];
        }

        function renderLevel(level) {
            const thumbnailUrl = getThumbnail(level);

            content.innerHTML = `
                <div class="level-card">
                    <h2>${level.name}</h2>
                    <img src="${thumbnailUrl}" alt="${level.name}" class="thumbnail" onerror="this.src='https://via.placeholder.com/800x450?text=No+Thumbnail'">
                    <div class="level-info">
                        <div class="info-item">

                        </div>
                        <div class="info-item">
                            <div class="info-label">List %</div>
                            <div class="info-value">${level.listPercent}%</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Category</div>
                            <div class="info-value">${level.category}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">GD ID</div>
                            <div class="info-value">${level.gdId}</div>
                        </div>
                    </div>
                    ${level.youtubeUrl ? `<a href="${level.youtubeUrl}" target="_blank" style="display: inline-block; padding: 12px 24px; background: #ff0000; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 15px;">Watch on YouTube</a>` : ''}
                    ${level.description ? `<p style="margin-top: 15px; color: #666;">${level.description}</p>` : ''}
                    <div class="input-group">
                        <input type="number" id="percentInput" min="0" max="100" placeholder="Enter your %" onkeydown="if(event.key==='Enter')submitPercent()" />
                        <button onclick="submitPercent()">Submit</button>
                        <button onclick="skipLevel()" ${skipsLeft <= 0 ? 'disabled' : ''} style="background:#e67e22; border-color:#e67e22;">Skip (${skipsLeft})</button>
                    </div>
                </div>
            `;
        }

        function startChallenge() {
            remainingLevels = filterLevels();
            if (remainingLevels.length === 0) {
                content.innerHTML = '<div class="error">No levels available for selected category!</div>';
                return;
            }
            
            requiredPercent = 1;
            clearedCount = 0;
            history = [];
            isActive = true;
            skipsLeft = parseInt(skipsInput.value) || 0;
            
            requiredPercentEl.textContent = requiredPercent + '%';
            levelsClearedEl.textContent = clearedCount;
            totalLevelsEl.textContent = remainingLevels.length;
            skipsLeftEl.textContent = skipsLeft;
            
            startBtn.disabled = true;
            giveUpBtn.disabled = false;
            categorySelect.disabled = true;
            skipsInput.disabled = true;
            historySection.style.display = 'none';
            restorePanel.style.display = 'none';
            
            nextLevel();
        }

        function nextLevel() {
            if (remainingLevels.length === 0) {
                endGame('No more levels remaining!');
                return;
            }
            
            currentLevel = getRandomLevel();
            renderLevel(currentLevel);
            totalLevelsEl.textContent = remainingLevels.length;
        }

        function submitPercent() {
            const input = document.getElementById('percentInput');
            const achievedPercent = parseInt(input.value);
            
            if (isNaN(achievedPercent) || achievedPercent < 0 || achievedPercent > 100) {
                alert('Please enter a valid percentage (0-100)');
                return;
            }
            
            if (achievedPercent < requiredPercent) {
                if (!confirm(`${achievedPercent}% is BELOW the required ${requiredPercent}% — this ENDS the run. Submit anyway?`)) return;
                endGame(`Failed! You got ${achievedPercent}% but needed ${requiredPercent}%`);
                return;
            }

            if (achievedPercent !== requiredPercent) {
                if (!confirm(`Log ${achievedPercent}% on ${currentLevel.name}? Next level will require ${Math.min(achievedPercent + 1, 100)}%.`)) return;
            }
            
            // Success
            clearedCount++;
            history.push({
                level: currentLevel.name,
                required: requiredPercent,
                achieved: achievedPercent
            });
            
            levelsClearedEl.textContent = clearedCount;
            updateHistory();
            
            if (achievedPercent === 100) {
                victory();
                return;
            }
            
            // Next level requires (achieved + 1)%
            requiredPercent = achievedPercent + 1;
            requiredPercentEl.textContent = requiredPercent + '%';
            
            nextLevel();
        }

        function victory() {
            content.innerHTML = '<div class="victory">GG!</div>';
            endGame('', true);
        }

        function endGame(message, isVictory = false) {
            isActive = false;
            startBtn.disabled = false;
            giveUpBtn.disabled = true;

                        <p>Levels cleared: ${clearedCount}</p>
                        <p>Final required %: ${requiredPercent}%</p>
                    </div>
                `;
            }
            
            historySection.style.display = history.length > 0 ? 'block' : 'none';
        }

        function updateHistory() {
            historyList.innerHTML = history.map(h => `
                <div class="history-item">
                    <span><strong>${h.level}</strong></span>
                    <span>${h.skipped ? 'SKIPPED' : `Required: ${h.required}% | Achieved: ${h.achieved}%`}</span>
                </div>
            `).join('');
            historySection.style.display = 'block';
        }

        function skipLevel() {
            if (skipsLeft <= 0) { alert('No skips left!'); return; }
            if (!confirm(`Skip ${currentLevel.name}? (${skipsLeft - 1} skips left after)`)) return;
            skipsLeft--;
            skipsLeftEl.textContent = skipsLeft;
            history.push({ level: currentLevel.name, skipped: true });
            updateHistory();
            nextLevel();
        }

        function giveUp() {
            if (confirm('Are you sure you want to give up?')) {
                endGame('You gave up!');
            }
        }

        function findLevelsByName(name) {
            const n = name.trim().toLowerCase();
            return allLevels.filter(l => l.name.toLowerCase() === n).sort((a, b) => a.rank - b.rank);
        }

        function restoreRun() {
            const lines = document.getElementById('restoreText').value.split('\n').map(s => s.trim()).filter(Boolean);
            const usedSlugs = new Set();
            const entries = [];
            const bad = [];

            let restoredSkips = null;
            for (const line of lines) {
                let m = line.match(/^SKIPS:\s*(\d+)$/i);
                if (m) { restoredSkips = parseInt(m[1], 10); continue; }
                m = line.match(/^SKIP:\s*(.+)$/i);
                if (m) {
                    const sl = findLevelsByName(m[1]).find(l => !usedSlugs.has(l.slug));
                    if (!sl) { bad.push(line); continue; }
                    usedSlugs.add(sl.slug);
                    entries.push({ level: sl, skipped: true });
                    continue;
                }
                m = line.match(/^(.*?)\s+Required:\s*\d+%?\s*\|?\s*Achieved:\s*(\d+)%?\s*$/i);
                if (!m) m = line.match(/^(.*?)\s*,\s*(\d+)%?\s*$/);
                if (!m || !m[1].trim()) { bad.push(line); continue; }
                const achieved = parseInt(m[2], 10);
                const lvl = findLevelsByName(m[1]).find(l => !usedSlugs.has(l.slug));
                if (!lvl || isNaN(achieved) || achieved < 0 || achieved > 100) { bad.push(line); continue; }
                usedSlugs.add(lvl.slug);
                entries.push({ level: lvl, achieved });
            }

            if (bad.length) {
                alert('Could not match these lines:\n\n' + bad.join('\n'));
                return;
            }

            const forceName = document.getElementById('forceNext').value.trim();
            let forced = null;
            if (forceName) {
                forced = findLevelsByName(forceName).find(l => !usedSlugs.has(l.slug));
                if (!forced) {
                    alert('Force-next level not found or already used: ' + forceName);
                    return;
                }
                usedSlugs.add(forced.slug);
            }

            remainingLevels = filterLevels().filter(l => !usedSlugs.has(l.slug));

            let req = 1;
            history = entries.map(e => {
                if (e.skipped) return { level: e.level.name, skipped: true };
                const h = { level: e.level.name, required: req, achieved: e.achieved };
                req = Math.min(e.achieved + 1, 100);
                return h;
            });
            requiredPercent = req;
            clearedCount = entries.filter(e => !e.skipped).length;
            skipsLeft = restoredSkips !== null ? restoredSkips : (parseInt(skipsInput.value) || 0);
            isActive = true;

            requiredPercentEl.textContent = requiredPercent + '%';
            levelsClearedEl.textContent = clearedCount;
            totalLevelsEl.textContent = remainingLevels.length;
            skipsLeftEl.textContent = skipsLeft;
            startBtn.disabled = true;
            giveUpBtn.disabled = false;
            categorySelect.disabled = true;
            skipsInput.disabled = true;
            restorePanel.style.display = 'none';
            updateHistory();

            if (forced) {
                currentLevel = forced;
                renderLevel(forced);
            } else {
                nextLevel();
            }
        }

        async function exportRun() {
            if (!history.length) {
                alert('Nothing to export yet — clear a level first.');
                return;
            }
            const text = `SKIPS: ${skipsLeft}\n` + history.map(h => h.skipped ? `SKIP: ${h.level}` : `${h.level}, ${h.achieved}`).join('\n');
            document.getElementById('restoreText').value = text;
            document.getElementById('forceNext').value = (isActive && currentLevel) ? currentLevel.name : '';
            restorePanel.style.display = 'block';
            let msg = 'Run loaded into restore box';
            try {
                await navigator.clipboard.writeText(text);
                msg = 'Run copied to clipboard!';
            } catch (e) {}
            exportBtn.textContent = '✓ ' + msg;
            setTimeout(() => exportBtn.textContent = 'Export Run', 2500);
        }

        restoreBtn.addEventListener('click', () => {
            restorePanel.style.display = restorePanel.style.display === 'none' ? 'block' : 'none';
        });
        exportBtn.addEventListener('click', exportRun);
        startBtn.addEventListener('click', startChallenge);
        giveUpBtn.addEventListener('click', giveUp);

        fetchLevels();
    </script>
</body>
</html>
